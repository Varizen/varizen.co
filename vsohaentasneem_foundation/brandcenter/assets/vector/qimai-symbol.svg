<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="symQimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <filter id="symQimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="48" cy="48" r="40" fill="url(#symQimGrad)" opacity="0.15" filter="url(#symQimGlow)"/>

  <!-- Outer Quantum Ring -->
  <circle cx="48" cy="48" r="34" stroke="url(#symQimGrad)" stroke-width="7.5" stroke-linecap="round"/>

  <!-- Inner Core & Center -->
  <circle cx="48" cy="48" r="15" fill="#0D1117" stroke="url(#symQimGrad)" stroke-width="3"/>
  <circle cx="48" cy="48" r="6" fill="#00D4FF"/>

  <!-- Neural Tail -->
  <path d="M 64 64 L 84 84" stroke="url(#symQimGrad)" stroke-width="8.5" stroke-linecap="round"/>
  <!-- Terminal Data Node -->
  <circle cx="84" cy="84" r="5" fill="#00D4FF"/>
  <!-- Satellite Node -->
  <circle cx="26" cy="28" r="3" fill="#00D4FF"/>
</svg>
