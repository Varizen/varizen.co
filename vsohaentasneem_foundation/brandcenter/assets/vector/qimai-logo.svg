<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 80" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="qimBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
    <linearGradient id="qimCyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <filter id="qimGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Q Mark Symbol Left -->
  <g transform="translate(10, 10)">
    <!-- Ambient Tech Glow -->
    <circle cx="30" cy="30" r="26" fill="url(#qimBlueGrad)" opacity="0.15" filter="url(#qimGlow)"/>
    
    <!-- Outer Quantum Ring -->
    <circle cx="30" cy="30" r="22" stroke="url(#qimBlueGrad)" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Inner Core & Data Node -->
    <circle cx="30" cy="30" r="10" fill="#0D1117" stroke="url(#qimBlueGrad)" stroke-width="2"/>
    <circle cx="30" cy="30" r="4" fill="#00D4FF"/>

    <!-- Distinctive Intelligent Q Tail / Neural Connector -->
    <path d="M 40 40 L 52 52" stroke="url(#qimBlueGrad)" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Signal Node Pulse at tail -->
    <circle cx="52" cy="52" r="3.5" fill="#00D4FF"/>
    <!-- Orbiting Accent Spark -->
    <circle cx="16" cy="18" r="2" fill="#00D4FF"/>
  </g>

  <!-- Wordmark & Positioning Right -->
  <g transform="translate(85, 14)">
    <!-- Primary Brand Name "QIM" -->
    <text x="0" y="34" font-family="'Inter', -apple-system, system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5" fill="#FFFFFF">QIM</text>
    
    <!-- "AI 2.1" High-Tech Badge -->
    <g transform="translate(82, 8)">
      <rect x="0" y="0" width="76" height="28" rx="6" fill="#0D1117" stroke="url(#qimBlueGrad)" stroke-width="1.5"/>
      <rect x="0" y="0" width="76" height="28" rx="6" fill="url(#qimBlueGrad)" opacity="0.12"/>
      <text x="38" y="19" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="1" fill="#00D4FF" text-anchor="middle">AI 2.1</text>
    </g>

    <!-- Official Tagline -->
    <text x="1" y="52" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.5" fill="#94A3B8">Smarter Intelligence. Better Tomorrow.</text>
  </g>
</svg>
