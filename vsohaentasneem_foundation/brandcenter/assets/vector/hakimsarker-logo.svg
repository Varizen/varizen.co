<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="ahsGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7B38"/>
    </linearGradient>
    <linearGradient id="ahsBlueFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="ahsOuterFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </linearGradient>
    <filter id="flameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Symbol Left: Book & Torch -->
  <g transform="translate(10, 8)">
    <!-- Open Book Base -->
    <path d="M 12 62 Q 28 54 44 60 Q 60 54 76 62 L 76 66 Q 60 58 44 64 Q 28 58 12 66 Z" fill="url(#ahsGoldGrad)"/>
    <path d="M 14 58 Q 28 51 43 56 L 43 62 Q 28 57 14 62 Z" fill="#E5C378" opacity="0.6"/>
    <path d="M 74 58 Q 60 51 45 56 L 45 62 Q 60 57 74 62 Z" fill="#E5C378" opacity="0.6"/>
    <line x1="44" y1="56" x2="44" y2="64" stroke="#785E22" stroke-width="1.5"/>

    <!-- Classical Torch Handle -->
    <path d="M 41 54 L 47 54 L 46 38 L 42 38 Z" fill="url(#ahsGoldGrad)"/>
    <!-- Torch Capital / Bowl -->
    <path d="M 38 38 Q 44 35 50 38 L 52 32 L 36 32 Z" fill="url(#ahsGoldGrad)"/>
    <rect x="36" y="31" width="16" height="2" rx="1" fill="#FDE047"/>

    <!-- Outer Aura Flame -->
    <path d="M 44 10 C 37 20 37 29 44 32 C 51 29 51 20 44 10 Z" fill="url(#ahsOuterFlame)" filter="url(#flameGlow)"/>
    <!-- Vibrant Blue Inner Flame -->
    <path d="M 44 16 C 39 23 40 28 44 31 C 48 28 49 23 44 16 Z" fill="url(#ahsBlueFlame)"/>
    <!-- Flame Core -->
    <path d="M 44 22 C 42 26 42 29 44 30.5 C 46 29 46 26 44 22 Z" fill="#DBEAFE"/>
  </g>

  <!-- Typography Right -->
  <g transform="translate(100, 15)">
    <!-- Domain Tag / Identifier -->
    <text x="0" y="16" font-family="'Cinzel', 'Georgia', serif" font-size="11" font-weight="700" letter-spacing="3" fill="#C5A059">HAKIM SARKER.ORG</text>
    
    <!-- Primary Scholar Name -->
    <text x="0" y="38" font-family="'Cinzel', 'Georgia', 'Playfair Display', serif" font-size="19" font-weight="700" letter-spacing="0.5" fill="#FFFFFF">PROF. DR. ABDUL HAKIM SARKER</text>
    
    <!-- Academic Role & Dates -->
    <text x="0" y="55" font-family="'Inter', sans-serif" font-size="10.5" font-weight="500" letter-spacing="1" fill="#94A3B8">1947 — 2025 · ACADEMIC LEGACY &amp; KNOWLEDGE ARCHIVE</text>

    <!-- Tagline -->
    <text x="0" y="70" font-family="'Playfair Display', 'Georgia', serif" font-size="11" font-style="italic" fill="#C5A059" opacity="0.9">"Nurturing Knowledge for Applied Social Change"</text>
  </g>
</svg>
