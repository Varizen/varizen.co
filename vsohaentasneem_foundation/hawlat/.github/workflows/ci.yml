name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: hawlat, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: hawlat}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U hawlat" --health-interval 5s --health-retries 10
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Migrate PostgreSQL (applies append-only and ledger-balance triggers)
        env: {HAWLAT_DATABASE_URL: "postgresql+psycopg://hawlat:ci-only@localhost:5432/hawlat"}
        run: alembic upgrade head
  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm ci || npm install
      - run: npx tsc --noEmit
      - run: npm run build
