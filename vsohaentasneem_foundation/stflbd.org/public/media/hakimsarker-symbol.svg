<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="symGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C378"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#9A7B38"/>
    </linearGradient>
    <linearGradient id="symBlueFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="symOuterFlame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#C5A059" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FDE047" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FEF08A" stop-opacity="0"/>
    </linearGradient>
    <filter id="symFlameGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Outer Archival Shield -->
  <circle cx="50" cy="50" r="47" stroke="url(#symGoldGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6"/>
  <circle cx="50" cy="50" r="43" fill="#0B1A2E" stroke="url(#symGoldGrad)" stroke-width="2"/>

  <!-- Open Book Base -->
  <path d="M 18 74 Q 34 66 50 72 Q 66 66 82 74 L 82 78 Q 66 70 50 76 Q 34 70 18 78 Z" fill="url(#symGoldGrad)"/>
  <path d="M 20 70 Q 34 63 49 68 L 49 74 Q 34 69 20 74 Z" fill="#E5C378" opacity="0.6"/>
  <path d="M 80 70 Q 66 63 51 68 L 51 74 Q 66 69 80 74 Z" fill="#E5C378" opacity="0.6"/>
  <line x1="50" y1="68" x2="50" y2="76" stroke="#785E22" stroke-width="1.5"/>

  <!-- Classical Torch Handle -->
  <path d="M 47 66 L 53 66 L 52 48 L 48 48 Z" fill="url(#symGoldGrad)"/>
  <!-- Torch Capital / Bowl -->
  <path d="M 44 48 Q 50 45 56 48 L 58 42 L 42 42 Z" fill="url(#symGoldGrad)"/>
  <rect x="42" y="41" width="16" height="2" rx="1" fill="#FDE047"/>

  <!-- Outer Aura Flame -->
  <path d="M 50 18 C 42 28 42 38 50 42 C 58 38 58 28 50 18 Z" fill="url(#symOuterFlame)" filter="url(#symFlameGlow)"/>
  <!-- Vibrant Blue Inner Flame -->
  <path d="M 50 24 C 44 32 45 37 50 41 C 55 37 56 32 50 24 Z" fill="url(#symBlueFlame)"/>
  <!-- Flame Core -->
  <path d="M 50 30 C 48 35 48 38 50 40.5 C 52 38 52 35 50 30 Z" fill="#DBEAFE"/>
</svg>
