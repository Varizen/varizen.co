<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="ahsPortraitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="ahsGoldFrame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="30%" stop-color="#C5A059"/>
      <stop offset="70%" stop-color="#9A7B38"/>
      <stop offset="100%" stop-color="#E5C378"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="tieGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>

  <!-- Frame Background -->
  <rect x="10" y="10" width="380" height="460" rx="16" fill="url(#ahsPortraitBg)" stroke="url(#ahsGoldFrame)" stroke-width="2.5"/>
  <rect x="18" y="18" width="364" height="444" rx="12" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- Academic Glow behind Head -->
  <circle cx="200" cy="180" r="110" fill="#C5A059" opacity="0.08"/>
  <circle cx="200" cy="180" r="85" fill="#2563EB" opacity="0.06"/>

  <!-- Scholar Silhouette & Portrait -->
  <g id="scholar-illustration">
    <!-- Suit Shoulders & Torso -->
    <path d="M 90 410 C 90 330 130 300 170 290 L 175 320 L 200 345 L 225 320 L 230 290 C 270 300 310 330 310 410 Z" fill="url(#suitGrad)" stroke="#334155" stroke-width="1"/>
    <!-- Suit Lapels -->
    <path d="M 140 410 L 165 310 L 188 335 L 175 410 Z" fill="#0F172A" stroke="#475569" stroke-width="0.5"/>
    <path d="M 260 410 L 235 310 L 212 335 L 225 410 Z" fill="#0F172A" stroke="#475569" stroke-width="0.5"/>
    
    <!-- White Shirt Collar -->
    <polygon points="175,290 200,325 188,325 182,280" fill="#F8FAFC"/>
    <polygon points="225,290 200,325 212,325 218,280" fill="#F8FAFC"/>
    
    <!-- Maroon / Crimson Academic Tie -->
    <polygon points="196,310 204,310 208,320 200,326 192,320" fill="url(#tieGrad)"/>
    <polygon points="194,324 206,324 212,410 188,410" fill="url(#tieGrad)"/>
    <!-- Tie Stripes -->
    <line x1="195" y1="345" x2="205" y2="340" stroke="#C5A059" stroke-width="1" opacity="0.7"/>
    <line x1="193" y1="370" x2="207" y2="365" stroke="#C5A059" stroke-width="1" opacity="0.7"/>
    <line x1="190" y1="395" x2="210" y2="390" stroke="#C5A059" stroke-width="1" opacity="0.7"/>

    <!-- Neck -->
    <rect x="184" y="235" width="32" height="50" rx="4" fill="#D4A373"/>

    <!-- Head & Face Structure -->
    <ellipse cx="200" cy="180" rx="55" ry="68" fill="#E2B184"/>
    
    <!-- Distinguished Hair (Silver-Grey) -->
    <path d="M 144 180 C 142 125 155 105 200 105 C 245 105 258 125 256 180 C 250 140 240 120 200 120 C 160 120 150 140 144 180 Z" fill="#94A3B8"/>
    <path d="M 145 175 C 143 145 150 120 175 112 C 160 125 152 145 150 175 Z" fill="#CBD5E1"/>
    <path d="M 255 175 C 257 145 250 120 225 112 C 240 125 248 145 250 175 Z" fill="#CBD5E1"/>

    <!-- Ears -->
    <ellipse cx="143" cy="185" rx="7" ry="14" fill="#D4A373"/>
    <ellipse cx="257" cy="185" rx="7" ry="14" fill="#D4A373"/>

    <!-- Eyebrows -->
    <path d="M 165 160 Q 178 156 188 160" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 235 160 Q 222 156 212 160" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Scholarly Glasses (Gold Frame) -->
    <rect x="160" y="165" width="32" height="22" rx="5" fill="none" stroke="#C5A059" stroke-width="2"/>
    <rect x="208" y="165" width="32" height="22" rx="5" fill="none" stroke="#C5A059" stroke-width="2"/>
    <!-- Glasses Bridge & Temples -->
    <line x1="192" y1="174" x2="208" y2="174" stroke="#C5A059" stroke-width="2"/>
    <line x1="160" y1="174" x2="144" y2="170" stroke="#C5A059" stroke-width="1.5"/>
    <line x1="240" y1="174" x2="256" y2="170" stroke="#C5A059" stroke-width="1.5"/>
    <!-- Glass Lens Reflections -->
    <line x1="164" y1="170" x2="174" y2="180" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>
    <line x1="212" y1="170" x2="222" y2="180" stroke="#FFFFFF" stroke-width="1" opacity="0.6"/>

    <!-- Eyes Behind Glasses -->
    <circle cx="176" cy="176" r="3.5" fill="#334155"/>
    <circle cx="224" cy="176" r="3.5" fill="#334155"/>
    <circle cx="177" cy="175" r="1" fill="#FFFFFF"/>
    <circle cx="225" cy="175" r="1" fill="#FFFFFF"/>

    <!-- Nose -->
    <path d="M 200 172 L 197 198 L 204 198" fill="none" stroke="#B48256" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Warm Scholarly Smile -->
    <path d="M 185 215 Q 200 224 215 215" fill="none" stroke="#9A6237" stroke-width="2" stroke-linecap="round"/>
    <path d="M 190 222 Q 200 226 210 222" fill="none" stroke="#B48256" stroke-width="1" stroke-linecap="round"/>

    <!-- Dignified Facial Character Lines -->
    <path d="M 158 178 Q 155 186 160 192" fill="none" stroke="#C99568" stroke-width="1" opacity="0.6"/>
    <path d="M 242 178 Q 245 186 240 192" fill="none" stroke="#C99568" stroke-width="1" opacity="0.6"/>
    <path d="M 178 208 Q 174 218 176 226" fill="none" stroke="#C99568" stroke-width="0.8" opacity="0.5"/>
    <path d="M 222 208 Q 226 218 224 226" fill="none" stroke="#C99568" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Plaque at Base -->
  <g transform="translate(30, 412)">
    <rect x="0" y="0" width="340" height="48" rx="8" fill="#0A0F1D" stroke="#C5A059" stroke-width="1.2"/>
    <text x="170" y="20" font-family="'Cinzel', 'Georgia', serif" font-size="12" font-weight="700" fill="#E5C378" text-anchor="middle" letter-spacing="1">PROF. DR. ABDUL HAKIM SARKER</text>
    <text x="170" y="36" font-family="'Inter', sans-serif" font-size="9" font-weight="500" fill="#94A3B8" text-anchor="middle" letter-spacing="1.5">1947 — 2025 · UNIVERSITY OF DHAKA · ISLAMIC UNIVERSITY</text>
  </g>
</svg>
