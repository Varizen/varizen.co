<div class="room" id="room">

  <!-- ======================= TOP BAR ======================= -->
  <header class="room-top">
    <div class="room-title-wrap">
      <span class="rec-pill idle" id="recPill"><svg><use href="#i-rec"/></svg><span>REC</span></span>
      <span class="room-title" id="roomTitle">Meeting</span>
    </div>

    <div class="room-top-right">
      <span class="secure-badge" id="secureBadge" hidden><svg><use href="#i-lock"/></svg><span>Secure session</span></span>
      <span class="room-timer" id="roomTimer"><svg><use href="#i-clock"/></svg><span id="timerValue">00:00</span></span>
      <button class="room-top-btn" id="btnToggleRail" title="Toggle panel"><svg><use href="#i-more-v"/></svg></button>
      <button class="room-top-btn" id="btnRoomSettings" title="Meeting settings"><svg><use href="#i-settings"/></svg></button>
    </div>
  </header>

  <!-- ======================= STAGE ======================= -->
  <section class="room-stage" id="stage">
    <div class="tile-grid gallery" id="tileGrid"></div>

    <div class="lower-third" id="lowerThird" hidden>
      <strong id="ltName"></strong>
      <span id="ltTitle"></span>
    </div>

    <div class="countdown-chip" id="countdownChip" hidden>
      <svg><use href="#i-clock"/></svg><span id="countdownText"></span>
    </div>

    <!-- CONTROL DOCK -->
    <nav class="dock" id="dock">
      <button class="dock-btn" id="btnMic" title="Microphone (M)">
        <svg><use href="#i-mic"/></svg><span>Mute</span>
      </button>
      <button class="dock-btn" id="btnCamera" title="Camera (V)">
        <svg><use href="#i-camera"/></svg><span>Camera</span>
      </button>
      <button class="dock-btn" id="btnShare" title="Share screen">
        <svg><use href="#i-screen"/></svg><span>Share</span>
      </button>
      <div class="dock-sep"></div>
      <button class="dock-btn" id="btnChat" title="Chat">
        <svg><use href="#i-chat"/></svg><span>Chat</span>
      </button>
      <button class="dock-btn" id="btnPeople" title="Participants">
        <svg><use href="#i-users"/></svg><span>People</span>
      </button>
      <button class="dock-btn" id="btnAi" title="AI notes">
        <svg><use href="#i-spark"/></svg><span>AI</span>
      </button>
      <button class="dock-btn" id="btnRecord" title="Record">
        <svg><use href="#i-rec"/></svg><span>Record</span>
      </button>
      <button class="dock-btn" id="btnMore" title="More">
        <svg><use href="#i-more"/></svg><span>More</span>
      </button>
      <button class="dock-leave" id="btnLeave">Leave</button>
    </nav>

    <div class="overlay-card" id="overlay" hidden>
      <div class="overlay-inner" id="overlayInner"></div>
    </div>
  </section>

  <!-- ======================= RAIL ======================= -->
  <aside class="rail" id="rail">
    <div class="rail-tabs">
      <button class="rail-tab active" data-rail="chat">Chat</button>
      <button class="rail-tab" data-rail="people">Participants<span class="badge" id="peopleBadge">0</span></button>
      <button class="rail-tab" data-rail="ai">AI Notes</button>
      <button class="rail-tab" data-rail="more">More</button>
      <button class="rail-close" id="btnRailClose" title="Hide panel"><svg><use href="#i-close"/></svg></button>
    </div>

    <div class="rail-body">
      <!-- CHAT -->
      <div class="rail-panel" data-panel="chat">
        <div class="rail-scroll" id="chatList"></div>
        <form class="composer" id="chatForm">
          <div class="composer-box">
            <input id="chatInput" type="text" placeholder="Type a message…" autocomplete="off" maxlength="4000">
            <button type="button" class="composer-icon" id="btnChatAttach" title="Share a file reference"><svg><use href="#i-files"/></svg></button>
          </div>
          <button type="submit" class="composer-send" aria-label="Send"><svg><use href="#i-arrow-right"/></svg></button>
        </form>
      </div>

      <!-- PEOPLE -->
      <div class="rail-panel" data-panel="people" hidden>
        <div class="rail-scroll" id="peopleList"></div>
      </div>

      <!-- AI NOTES -->
      <div class="rail-panel" data-panel="ai" hidden>
        <div class="rail-scroll" id="aiList"></div>
        <form class="composer" id="aiForm">
          <div class="composer-box">
            <input id="aiInput" type="text" placeholder="Ask the meeting agent…" autocomplete="off">
          </div>
          <button type="submit" class="composer-send" aria-label="Ask"><svg><use href="#i-spark"/></svg></button>
        </form>
      </div>
      <!-- MORE -->
      <div class="rail-panel" data-panel="more" hidden>
        <div class="rail-scroll" id="moreList"></div>
      </div>
    </div>
  </aside>
</div>

<!-- ======================= MORE MODAL ======================= -->
<div class="modal-overlay" id="moreModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h3>Meeting tools</h3>
      <button class="close-btn" id="btnCloseMore" aria-label="Close">&times;</button>
    </div>
    <div class="modal-body" id="moreBody"></div>
  </div>
</div>

<div class="toast-stack" id="toasts"></div>

<script src="/room.js"></script>
</body>
</html>
