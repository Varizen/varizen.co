<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f7f9">
<meta name="robots" content="noindex">
<title>Join a ZMeet meeting</title>
<link rel="stylesheet" href="/style.css">
<style>
  .join-wrap {
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(900px 460px at 50% -10%, rgba(47, 107, 255, 0.12), transparent 70%),
      var(--bg);
  }
  .join-card {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: var(--r-2xl);
    box-shadow: var(--shadow-lg);
    padding: 26px;
  }
  .join-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    margin-bottom: 20px;
  }
  .join-brand .brand-mark { width: 28px; height: 28px; }
  .join-meeting { font-size: 19px; font-weight: 680; letter-spacing: -0.4px; line-height: 1.25; }
  .join-meta { margin-top: 6px; font-size: 12.5px; color: var(--ink-3); display: flex; flex-wrap: wrap; gap: 10px; }
  .join-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .join-meta svg { width: 12px; height: 12px; color: var(--ink-4); }
  .join-form { margin-top: 20px; display: flex; flex-direction: column; gap: 12px; }
  .join-btn {
    height: 42px; border-radius: var(--r-md); background: var(--blue); color: #fff;
    font-size: 13.5px; font-weight: 640; display: flex; align-items: center; justify-content: center; gap: 7px;
    box-shadow: 0 6px 18px rgba(47,107,255,.28); transition: background .15s;
  }
  .join-btn:hover { background: var(--blue-dark); }
  .join-btn:disabled { opacity: .6; }
  .join-btn svg { width: 15px; height: 15px; }
  .join-org {
    display: flex; align-items: center; gap: 9px; padding: 10px 12px; margin-top: 18px;
    border-radius: var(--r-md); background: var(--bg); border: 1px solid var(--line-soft);
  }
  .join-org .org-avatar { width: 28px; height: 28px; }
  .join-org-name { font-size: 12.5px; font-weight: 620; }
  .join-org-sub { font-size: 11px; color: var(--ink-3); }
  .join-note { margin-top: 14px; font-size: 11.5px; color: var(--ink-3); line-height: 1.55; text-align: center; }
  .join-error { margin-top: 12px; font-size: 12px; color: var(--red-dark); }
  .join-secure {
    display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px;
    border-radius: var(--r-pill); background: var(--green-soft); border: 1px solid var(--green-line);
    color: var(--green); font-size: 10.5px; font-weight: 650;
  }
  .join-secure svg { width: 11px; height: 11px; }
</style>
</head>
<body>

<svg class="sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="2.5" y="6" width="12.5" height="12" rx="3"/><path d="M15 11l6.2-3.6v9.2L15 13z"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.2 2.7-5.4 6-5.4s6 2.2 6 5.4"/><path d="M16 5.2a3.2 3.2 0 010 6.2M17.5 14.4c2.3.5 3.9 2.3 3.9 4.6"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10.5" rx="3"/><path d="M8.2 10V7.6a3.8 3.8 0 017.6 0V10"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 2.5v6c0 4.4-2.9 7.7-7 9.5-4.1-1.8-7-5.1-7-9.5v-6z"/><path d="M9 12l2.2 2.2L15.4 10"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h13M12.5 6l6 6-6 6"/></symbol>
</svg>

<div class="join-wrap">
  <div class="join-card" id="card">
    <div class="join-brand">
      <div class="brand-mark"><svg><use href="#i-video"/></svg></div>
      <div>
        <div class="brand-name" style="font-size:13px">ZMeet</div>
        <div class="brand-sub">Meet · Present · Decide</div>
      </div>
    </div>
    <div id="content">
      <div class="brand-sub" style="font-size:12px">Loading meeting…</div>
    </div>
  </div>
</div>

<script>
const code = window.location.pathname.split('/').filter(Boolean).pop() || window.location.pathname.split('/r/')[1];

const icon = (n) => `<svg aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc = (t = '') => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function fmt(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return `${d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' })} · ${d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' })}`;
}

async function main() {
  const content = document.getElementById('content');
  let meta;
  try {
    const res = await fetch(`/api/rooms/${code}`);
    if (!res.ok) throw new Error('This meeting link is not valid or has expired.');
    meta = await res.json();
  } catch (err) {
    content.innerHTML = `<div class="join-meeting">Meeting unavailable</div>
      <div class="join-error">${esc(err.message)}</div>`;
    return;
  }

  const secure = meta.secure;
  const needsName = true;

  content.innerHTML = `
    <div class="join-meeting">${esc(meta.title)}</div>
    <div class="join-meta">
      <span>${icon('clock')}${fmt(meta.scheduledFor)}</span>
      <span>${icon('users')}${meta.participants?.length || 1} in the room</span>
      ${secure ? `<span class="join-secure">${icon('lock')}Secure session</span>` : ''}
    </div>

    <div class="join-org">
      <span class="org-avatar">${esc((meta.organizer?.organization || 'Z')[0])}</span>
      <div>
        <div class="join-org-name">${esc(meta.organizer?.organization || 'ZMeet')}</div>
        <div class="join-org-sub">Host: ${esc(meta.organizer?.email || meta.host?.name || '')}</div>
      </div>
    </div>

    <form class="join-form" id="joinForm">
      <div class="field">
        <label for="guestName">Your name</label>
        <input id="guestName" type="text" placeholder="How should we introduce you?" maxlength="60" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="guestEmail">Email <span style="font-weight:500;color:var(--ink-4)">(optional)</span></label>
        <input id="guestEmail" type="email" placeholder="you@company.com" autocomplete="email">
      </div>
      <button class="join-btn" type="submit">${icon('arrow-right')}Join meeting</button>
      <div class="join-error" id="joinError" hidden></div>
    </form>

    <div class="join-note">
      ${meta.admission === 'open'
        ? 'No account needed. Click join and you are in.'
        : 'The host admits guests from a waiting room. Keep this tab open.'}
      ${meta.secure ? '<br>This is a secure session: transport-encrypted with host-controlled admission — not end-to-end encrypted.' : ''}
    </div>`;

  document.getElementById('joinForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('guestName').value.trim();
    const email = document.getElementById('guestEmail').value.trim();
    if (!name) return;
    try {
      const res = await fetch(`/api/rooms/${code}/join`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email: email || undefined, guest: true })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Could not join');
      sessionStorage.setItem('zm_guest_name', name);
      window.location.href = `/r/${code}?name=${encodeURIComponent(name)}`;
    } catch (err) {
      const box = document.getElementById('joinError');
      box.hidden = false;
      box.textContent = err.message;
    }
  });

  document.getElementById('guestName').focus();
}

main();
</script>
</body>
</html>
