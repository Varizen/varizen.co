<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb">
<meta name="description" content="Zlet — one screen. Every wallet. Every payment. Every asset. Your universal financial control layer.">
<title>Zlet — One screen. Every wallet. Every payment. Every asset.</title>
<link rel="stylesheet" href="style.css?v=1">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 10.5L12 4l8 6.5V20a1.5 1.5 0 01-1.5 1.5h-13A1.5 1.5 0 014 20z"/><path d="M9.5 21.5v-7h5v7"/></symbol>

  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3L10.5 13.5"/><path d="M21 3l-6.8 18-3.7-7.5L3 9.8z"/></symbol>
  <symbol id="i-receive" viewBox="0 0 24 24"><path d="M12 3.5v13"/><path d="M6.8 11.2L12 16.5l5.2-5.3"/><path d="M4 20.5h16"/></symbol>
  <symbol id="i-exchange" viewBox="0 0 24 24"><path d="M4 8.5h13"/><path d="M13.5 4.5l4 4-4 4"/><path d="M20 15.5H7"/><path d="M10.5 11.5l-4 4 4 4"/></symbol>
  <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4.5L3.5 8 7 11.5"/><path d="M3.5 8h11a4 4 0 014 4"/><path d="M17 19.5l3.5-3.5-3.5-3.5"/><path d="M20.5 16h-11a4 4 0 01-4-4"/></symbol>
  <symbol id="i-defi" viewBox="0 0 24 24"><path d="M12 2.5l8 4.5v10l-8 4.5-8-4.5V7z"/><path d="M12 8.5l4 2.2v4.6l-4 2.2-4-2.2v-4.6z"/></symbol>
  <symbol id="i-assets" viewBox="0 0 24 24"><path d="M3.5 8.5A2.5 2.5 0 016 6h12a2.5 2.5 0 012.5 2.5v9A2.5 2.5 0 0118 20H6a2.5 2.5 0 01-2.5-2.5z"/><path d="M3.5 10.5h17"/><circle cx="16.5" cy="15" r="1.3"/></symbol>
  <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 13 2.5-7h5"/></symbol>
  <symbol id="i-sandbox" viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6.2L5.4 17A2.6 2.6 0 007.7 21h8.6a2.6 2.6 0 002.3-4L14 9.2V3"/><path d="M7.2 15h9.6"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 2.5v6c0 4.4-2.9 7.7-7 9.5-4.1-1.8-7-5.1-7-9.5v-6z"/><path d="M9 12l2.2 2.2L15.4 10"/></symbol>
  <symbol id="i-privacy" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10.5" rx="3"/><path d="M8.2 10V7.6a3.8 3.8 0 017.6 0V10"/></symbol>
  <symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><path d="M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5S14.4 18.2 12 20.5c-2.4-2.3-3.6-5.2-3.6-8.5S9.6 5.8 12 3.5z"/></symbol>
  <symbol id="i-merchant" viewBox="0 0 24 24"><path d="M4 9.5V19a1.5 1.5 0 001.5 1.5h13A1.5 1.5 0 0020 19V9.5"/><path d="M3 9.5L5 4h14l2 5.5"/><path d="M9 20.5v-5h6v5"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.2 16.2L21 21"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 4.9L19 10l-5.1 2.1L12 17l-1.9-4.9L5 10l5.1-2.1z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4.5 4.5L19 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l8.5 15H3.5z"/><path d="M12 10v4M12 16.6v.4"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M6.5 10.5L12 5l5.5 5.5"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M6.5 13.5L12 19l5.5-5.5"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M5.4 18.6l1.4-1.4M17.2 6.8l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a7 7 0 1010.5 10.5z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4.5V10h-5.4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10.5" rx="3"/><path d="M8.2 10V7.6a3.8 3.8 0 017.6 0V10"/><path d="M12 14v3"/></symbol>
  <symbol id="i-qr" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3zM20 14v3M14 20h3M20 20h1"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 015.7 0l2.3-2.3a4 4 0 10-5.7-5.7L11 7.3"/><path d="M14 10a4 4 0 01-5.7 0L6 12.3a4 4 0 105.7 5.7l1.3-1.3"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-chain" viewBox="0 0 24 24"><path d="M9 15l6-6"/><path d="M11 7l1.5-1.5a4 4 0 015.7 5.7L16.7 12"/><path d="M13 17l-1.5 1.5a4 4 0 01-5.7-5.7L7.3 12"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 8v.4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6"/><path d="M10 3v6.2L5.4 17A2.6 2.6 0 007.7 21h8.6a2.6 2.6 0 002.3-4L14 9.2V3"/></symbol>
</svg>

<div class="app" id="app">

  <!-- ============================ SIDEBAR ============================ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">Z</div>
      <div class="brand-text">
        <span class="brand-name">Zlet</span>
        <span class="brand-sub">Universal wallet</span>
      </div>
      <button class="icon-btn sidebar-close" id="btnCloseSidebar" aria-label="Close menu"><svg><use href="#i-close"/></svg></button>
    </div>

    <nav class="nav" id="primaryNav">
      <button class="nav-item active" data-view="home"><svg><use href="#i-home"/></svg><span>Home</span></button>
      <button class="nav-item" data-view="pay"><svg><use href="#i-pay"/></svg><span>Pay</span></button>
      <button class="nav-item" data-view="send"><svg><use href="#i-send"/></svg><span>Send</span></button>
      <button class="nav-item" data-view="receive"><svg><use href="#i-receive"/></svg><span>Receive</span></button>
      <button class="nav-item" data-view="exchange"><svg><use href="#i-exchange"/></svg><span>Exchange</span></button>
      <button class="nav-item" data-view="defi"><svg><use href="#i-defi"/></svg><span>DeFi</span></button>
      <button class="nav-item" data-view="assets"><svg><use href="#i-assets"/></svg><span>Assets</span><b class="nav-count" id="assetsCount">0</b></button>
      <button class="nav-item" data-view="activity"><svg><use href="#i-activity"/></svg><span>Activity</span><b class="nav-count" id="activityCount">0</b></button>
    </nav>

    <div class="side-scroll">
      <div class="side-section">
        <div class="side-head"><span>Control</span></div>
        <button class="nav-item slim" data-view="countries"><svg><use href="#i-globe"/></svg><span>Countries</span><b class="scope-badge" id="scopeBadge">2</b></button>
        <button class="nav-item slim" data-view="availability"><svg><use href="#i-check"/></svg><span>Availability</span></button>
        <button class="nav-item slim" data-view="merchant"><svg><use href="#i-merchant"/></svg><span>Merchant</span></button>
        <button class="nav-item slim" data-view="sandbox"><svg><use href="#i-flask"/></svg><span>Sandbox</span><b class="nav-count" id="sandboxCount">0</b></button>
        <button class="nav-item slim" data-view="security"><svg><use href="#i-shield"/></svg><span>Security</span></button>
        <button class="nav-item slim" data-view="privacy"><svg><use href="#i-privacy"/></svg><span>Privacy</span></button>
      </div>
    </div>

    <div class="side-foot">
      <div class="agent-chip" id="agentChip">
        <span class="agent-dot"></span>
        <span class="agent-label">AI Agent</span>
        <span class="agent-state" id="agentState">Observe</span>
      </div>
      <button class="btn-lock" id="btnLock"><svg><use href="#i-lock"/></svg><span>Lock Zlet</span></button>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- ============================= MAIN ============================= -->
  <main class="main" id="main">

    <header class="topbar">
      <button class="icon-btn menu-btn" id="btnMenu" aria-label="Menu"><svg><use href="#i-menu"/></svg></button>

      <div class="search-shell">
        <svg class="search-icon"><use href="#i-search"/></svg>
        <input id="askInput" type="text" autocomplete="off" spellcheck="false"
               placeholder="What do you want to do?">
        <kbd class="search-kbd">⌘K</kbd>
      </div>

      <div class="topbar-right">
        <div class="scope-pill" id="scopePill" title="Your two-country scope">
          <span id="scopeFlags">🇲🇾 🇧🇩</span>
        </div>
        <button class="icon-btn" id="btnSync" title="Synchronise providers"><svg><use href="#i-refresh"/></svg></button>
        <button class="icon-btn" id="btnTheme" title="Toggle theme (T)"><svg><use href="#i-sun"/></svg></button>
        <button class="icon-btn" id="btnAI" title="Ask Zlet (⌘K)"><svg><use href="#i-spark"/></svg></button>
      </div>
    </header>

    <div class="quick-pills" id="quickPills">
      <button class="pill" data-quick="send"><svg><use href="#i-send"/></svg>Send</button>
      <button class="pill" data-quick="pay"><svg><use href="#i-pay"/></svg>Pay</button>
      <button class="pill" data-quick="convert"><svg><use href="#i-exchange"/></svg>Convert</button>
      <button class="pill" data-quick="swap"><svg><use href="#i-swap"/></svg>Swap</button>
      <button class="pill" data-quick="route"><svg><use href="#i-globe"/></svg>Find best route</button>
      <button class="pill" data-quick="more"><svg><use href="#i-plus"/></svg>More</button>
    </div>

    <section class="stage" id="stage"></section>

    <div class="ai-dock" id="aiDock">
      <div class="ai-panel" id="aiPanel" hidden>
        <div class="ai-panel-head">
          <span class="ai-title"><svg><use href="#i-spark"/></svg>Ask Zlet</span>
          <button class="icon-btn" id="btnCloseAI" aria-label="Close"><svg><use href="#i-close"/></svg></button>
        </div>
        <div class="ai-thread" id="aiThread"></div>
        <div class="ai-suggest" id="aiSuggest">
          <button data-ask="How much can I actually spend?">How much can I actually spend?</button>
          <button data-ask="What's the cheapest way to send $2,000 to Bangladesh?">Cheapest way to send $2,000</button>
          <button data-ask="Convert 500 USDC to ETH">Convert 500 USDC to ETH</button>
          <button data-ask="Show my DeFi exposure">Show my DeFi exposure</button>
          <button data-ask="What's pending?">What's pending?</button>
          <button data-ask="Which countries am I scoped to?">Which countries?</button>
        </div>
        <form class="ai-form" id="aiForm">
          <input id="aiInput" type="text" autocomplete="off" placeholder="Ask anything about your money…">
          <button class="ai-send" type="submit" aria-label="Ask"><svg><use href="#i-arrow-up"/></svg></button>
        </form>
      </div>
    </div>

  </main>
</div>

<div class="toast-stack" id="toastStack"></div>

<div class="sheet-scrim" id="sheetScrim" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-head">
      <h2 class="sheet-title" id="sheetTitle">Confirm</h2>
      <button class="icon-btn" id="btnCloseSheet" aria-label="Close"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
    <div class="sheet-foot" id="sheetFoot"></div>
  </div>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
