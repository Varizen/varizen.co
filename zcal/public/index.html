<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="ZCal — all your calendars, one intelligent schedule. Plan in the sandbox, approve in one tap.">
<title>ZCal — All your calendars. One intelligent schedule.</title>
<link rel="icon" href="/brand/varizen-symbol-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/brand/varizen-symbol-16.png" sizes="16x16" type="image/png">
<link rel="apple-touch-icon" href="/brand/varizen-symbol-180.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
  <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
  <symbol id="i-today" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></symbol>
  <symbol id="i-agenda" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1.2"/><circle cx="3.5" cy="12" r="1.2"/><circle cx="3.5" cy="18" r="1.2"/></symbol>
  <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l1.9 4.9L19 10l-5.1 2.1L12 17l-1.9-4.9L5 10l5.1-2.1z"/><path d="M18.5 15.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
  <symbol id="i-tasks" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 11l2.2 2.2L16 8.4"/></symbol>
  <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6.2L5.4 17A2.6 2.6 0 007.7 21h8.6a2.6 2.6 0 002.3-4L14 9.2V3"/><path d="M7.2 15h9.6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.2 2.7-5.4 6-5.4s6 2.2 6 5.4"/><path d="M16 5.2a3.2 3.2 0 010 6.2M17.5 14.4c2.3.5 3.9 2.3 3.9 4.6"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M16.2 16.2L21 21"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 3.5v2M12 18.5v2M4.9 7.8l1.7 1M17.4 15.2l1.7 1M4.9 16.2l1.7-1M17.4 8.8l1.7-1"/></symbol>
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M5.4 18.6l1.4-1.4M17.2 6.8l1.4-1.4"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.5A8.5 8.5 0 019.5 4a7 7 0 1010.5 10.5z"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
  <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="6" width="12" height="12" rx="3"/><path d="M15 11l6-3.5v9L15 13z"/></symbol>
  <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s6.5-6 6.5-11a6.5 6.5 0 10-13 0C5.5 15 12 21 12 21z"/><circle cx="12" cy="10" r="2.4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.8A1.8 1.8 0 0110.8 3h2.4A1.8 1.8 0 0115 4.8V7M6.5 7l.8 12.2A2 2 0 009.3 21h5.4a2 2 0 002-1.8L17.5 7"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M15.5 4.5l4 4M4 20l4.2-.9L20 7.3a2 2 0 000-2.8l-1.5-1.5a2 2 0 00-2.8 0L4 15.8z"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 13l4.5 4.5L19 7"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4l8.5 15H3.5z"/><path d="M12 10v4M12 16.6v.4"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="10.5" rx="3"/><path d="M8.2 10V7.6a3.8 3.8 0 017.6 0V10"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5l10 6.5-10 6.5z"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.6-5.9"/><path d="M20 4.5V10h-5.4"/></symbol>
  <symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h13M12.5 6l6 6-6 6"/></symbol>
  <symbol id="i-wand" viewBox="0 0 24 24"><path d="M4 20l9.5-9.5M13 5l.9 2.3L16 8.2l-2.1.9L13 11.4l-.9-2.3L10 8.2l2.1-.9z"/><path d="M18.5 12.5l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 015.7 0l2.3-2.3a4 4 0 10-5.7-5.7L11 7.3"/><path d="M14 10a4 4 0 01-5.7 0L6 12.3a4 4 0 105.7 5.7l1.3-1.3"/></symbol>
  <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l7 2.5v6c0 4.4-2.9 7.7-7 9.5-4.1-1.8-7-5.1-7-9.5v-6z"/><path d="M9 12l2.2 2.2L15.4 10"/></symbol>
  <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></symbol>
  <symbol id="i-thinking" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9 10.5a3 3 0 015.6 1.4c0 1.6-2.1 1.7-2.6 3.1M12 17.4v.2"/></symbol>
</svg>

<div class="app" id="app">

  <!-- ======================= SIDEBAR ======================= -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><svg><use href="#i-calendar"/></svg></div>
      <div class="brand-text">
        <span class="brand-name">ZCal</span>
        <span class="brand-sub">One schedule</span>
      </div>
    </div>

    <button class="btn-create" id="btnCreate">
      <svg><use href="#i-plus"/></svg><span>New event</span><kbd>C</kbd>
    </button>

    <nav class="nav" id="primaryNav">
      <button class="nav-item" data-view="today">
        <svg><use href="#i-today"/></svg><span>Today</span>
      </button>
      <button class="nav-item active" data-view="week">
        <svg><use href="#i-calendar"/></svg><span>Calendar</span>
      </button>
      <button class="nav-item" data-view="agenda">
        <svg><use href="#i-agenda"/></svg><span>Agenda</span>
      </button>
      <button class="nav-item" data-view="ai">
        <svg><use href="#i-spark"/></svg><span>AI Planner</span>
        <span class="dot-badge" id="aiBadge" hidden></span>
      </button>
      <button class="nav-item" data-view="tasks">
        <svg><use href="#i-tasks"/></svg><span>Tasks</span>
        <b class="nav-count" id="taskCount">0</b>
      </button>
      <button class="nav-item" data-view="sandbox">
        <svg><use href="#i-flask"/></svg><span>Sandbox</span>
        <b class="nav-count" id="sandboxCount">0</b>
      </button>
      <button class="nav-item" data-view="accounts">
        <svg><use href="#i-users"/></svg><span>Accounts</span>
      </button>
    </nav>

    <div class="side-scroll">
      <div class="side-section">
        <div class="side-head">
          <span>Calendars</span>
          <button class="mini-btn" id="btnSync" title="Sync now"><svg><use href="#i-refresh"/></svg></button>
        </div>
        <div id="calendarList" class="cal-list"></div>
      </div>

      <div class="side-section">
        <div class="side-head"><span>Other</span></div>
        <button class="nav-item slim" data-view="privacy">
          <svg><use href="#i-shield"/></svg><span>Privacy</span>
        </button>
        <button class="nav-item slim" data-view="activity">
          <svg><use href="#i-clock"/></svg><span>AI Activity</span>
        </button>
        <button class="nav-item slim" data-view="settings">
          <svg><use href="#i-settings"/></svg><span>Settings</span>
        </button>
      </div>
    </div>

    <div class="side-foot">
      <button class="agent-chip" id="btnAgent" title="Toggle Agent Mode">
        <span class="agent-dot"></span>
        <span class="agent-label">Agent Mode</span>
        <span class="switch" aria-hidden="true"><i></i></span>
      </button>
    </div>
  </aside>

  <!-- ======================= MAIN ======================= -->
  <main class="main" id="main">

    <header class="topbar">
      <div class="topbar-left">
        <button class="btn-ghost" id="btnToday">Today</button>
        <div class="nav-arrows">
          <button class="icon-btn" id="btnPrev" aria-label="Previous"><svg><use href="#i-chevron-left"/></svg></button>
          <button class="icon-btn" id="btnNext" aria-label="Next"><svg><use href="#i-chevron-right"/></svg></button>
        </div>
        <h1 class="range-title" id="rangeTitle">April 2025</h1>
        <span class="tz-chip" id="tzChip" title="Your time zone"></span>
      </div>

      <div class="topbar-right">
        <div class="segmented" id="viewSwitch" role="tablist">
          <button data-mode="day" role="tab">Day</button>
          <button data-mode="week" class="active" role="tab">Week</button>
          <button data-mode="month" role="tab">Month</button>
          <button data-mode="agenda" role="tab">Agenda</button>
        </div>
        <button class="icon-btn" id="btnSearch" title="Search (/)"><svg><use href="#i-search"/></svg></button>
        <button class="icon-btn" id="btnTheme" title="Toggle theme (T)"><svg><use href="#i-sun"/></svg></button>
        <button class="icon-btn" id="btnAIPanel" title="AI panel (⌘K)"><svg><use href="#i-spark"/></svg></button>
      </div>
    </header>

    <div class="search-bar" id="searchBar" hidden>
      <svg><use href="#i-search"/></svg>
      <input id="searchInput" type="text" placeholder="Search calendar…  try “meetings with John”, “all Varizen meetings”, “longer than 2 hours”" autocomplete="off">
      <button class="icon-btn" id="btnCloseSearch"><svg><use href="#i-close"/></svg></button>
    </div>

    <section class="stage" id="stage"></section>

    <div class="ai-dock">
      <form class="ai-bar" id="aiForm">
        <svg class="ai-bar-icon"><use href="#i-wand"/></svg>
        <input id="aiInput" type="text" placeholder="Ask ZCal… “find a free hour with John next week”" autocomplete="off">
        <button type="button" class="ai-bar-hint" id="btnAISuggest">Suggest</button>
        <button type="submit" class="ai-bar-send" aria-label="Send"><svg><use href="#i-arrow-right"/></svg></button>
      </form>
    </div>
  </main>

  <!-- ======================= RIGHT PANEL ======================= -->
  <aside class="railed" id="rail">
    <div class="rail-tabs">
      <button class="rail-tab active" data-rail="context">Context</button>
      <button class="rail-tab" data-rail="agent">Agent</button>
      <button class="rail-tab" data-rail="sandbox">Sandbox</button>
      <button class="rail-close" id="btnRailClose" title="Hide panel"><svg><use href="#i-close"/></svg></button>
    </div>
    <div class="rail-body" id="railBody"></div>
  </aside>

  <!-- ======================= MOBILE NAV ======================= -->
  <nav class="mobile-nav">
    <button class="mnav-item" data-view="today"><svg><use href="#i-today"/></svg><span>Today</span></button>
    <button class="mnav-item active" data-view="week"><svg><use href="#i-calendar"/></svg><span>Calendar</span></button>
    <button class="mnav-item" data-view="ai"><svg><use href="#i-spark"/></svg><span>AI</span></button>
    <button class="mnav-item" data-view="more"><svg><use href="#i-more"/></svg><span>More</span></button>
  </nav>
  <button class="fab" id="btnFab" aria-label="New event"><svg><use href="#i-plus"/></svg></button>

  <!-- ======================= MODAL ======================= -->
  <div class="overlay" id="overlay" hidden>
    <div class="modal" id="modal">
      <div class="modal-head">
        <h2 id="modalTitle">New event</h2>
        <button class="icon-btn" id="btnModalClose"><svg><use href="#i-close"/></svg></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
